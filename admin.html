<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fio Banka — Admin</title>
    <style>
        :root {
            --bg: #0a0a0b; --bg-card: #141416; --border: #2a2a30;
            --text: #e8e8ec; --text-sec: #8b8b96; --text-muted: #5c5c66;
            --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
            --radius: 10px; --font: system-ui, sans-serif; --mono: 'Courier New', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; }
        h2 { font-size: 1.125rem; margin-bottom: 16px; color: var(--text-sec); }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
        label { display: block; font-size: 0.875rem; color: var(--text-sec); margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 0.9375rem; margin-bottom: 14px; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { font-family: var(--mono); font-size: 0.8125rem; min-height: 80px; resize: vertical; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 14px; font-size: 0.8125rem; }
        .msg { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.875rem; }
        .msg-ok { background: rgba(34,197,94,0.15); color: var(--green); }
        .msg-err { background: rgba(239,68,68,0.15); color: var(--red); }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 0.6875rem; font-weight: 600; }
        .badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge-yellow { background: rgba(234,179,8,0.15); color: #eab308; }
        .gap { display: flex; gap: 8px; }
        .mt { margin-top: 16px; }
    </style>
</head>
<body>
<div class="container">

    <!-- Login -->
    <div id="loginView">
        <h1>Admin Panel</h1>
        <div class="card">
            <div id="loginMsg" class="msg msg-err hidden"></div>
            <label>Admin heslo</label>
            <input type="password" id="adminPass" placeholder="Master heslo">
            <button class="btn btn-primary" onclick="adminLogin()">Prihlasit</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashView" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1>Klienti</h1>
            <button class="btn btn-primary btn-sm" onclick="showAddForm()">+ Novy klient</button>
        </div>

        <div id="dashMsg" class="msg hidden"></div>

        <!-- Client list -->
        <div class="card" id="clientList">
            <table>
                <thead><tr><th>ID</th><th>Nazev</th><th>Ucty</th><th>TOTP</th><th></th></tr></thead>
                <tbody id="clientsBody"></tbody>
            </table>
        </div>

        <!-- Add/Edit form -->
        <div class="card hidden" id="formCard">
            <h2 id="formTitle">Novy klient</h2>
            <label>ID (mala pismena, cisla, pomlcky)</label>
            <input type="text" id="fClientId" placeholder="jan-novak">
            <label>Nazev</label>
            <input type="text" id="fName" placeholder="Jan Novak">
            <label>Heslo</label>
            <input type="password" id="fPassword" placeholder="Silne heslo pro klienta">
            <label>Ucty (JSON pole)</label>
            <textarea id="fAccounts" placeholder='[{"name": "Bezny ucet", "fioToken": "token-z-fio-ib"}]'></textarea>
            <div class="gap">
                <button class="btn btn-primary" onclick="saveClient()">Ulozit</button>
                <button class="btn btn-sm" style="background: var(--border); color: var(--text);" onclick="hideForm()">Zrusit</button>
            </div>
        </div>
    </div>

</div>

<script>
let adminToken = null;
let editingId = null;

async function api(path, method, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (adminToken) opts.headers['Authorization'] = 'Bearer ' + adminToken;
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch('/api/admin/' + path, opts);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Chyba');
    return data;
}

async function adminLogin() {
    const pass = document.getElementById('adminPass').value;
    try {
        const data = await api('login', 'POST', { password: pass });
        adminToken = data.adminToken;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('dashView').classList.remove('hidden');
        loadClients();
    } catch (e) {
        const el = document.getElementById('loginMsg');
        el.textContent = e.message;
        el.classList.remove('hidden');
    }
}

async function loadClients() {
    try {
        const data = await api('clients', 'GET');
        const tbody = document.getElementById('clientsBody');
        if (data.clients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:32px;">Zadni klienti</td></tr>';
            return;
        }
        tbody.innerHTML = data.clients.map(c => `
            <tr>
                <td style="font-family:var(--mono);font-size:0.8125rem;">${c.id}</td>
                <td>${c.name}</td>
                <td>${c.accountCount}</td>
                <td>${c.totpEnrolled ? '<span class="badge badge-green">Aktivni</span>' : '<span class="badge badge-yellow">Ceka</span>'}</td>
                <td class="gap">
                    <button class="btn btn-sm" style="background:var(--border);color:var(--text);" onclick="editClient('${c.id}')">Upravit</button>
                    <button class="btn btn-danger btn-sm" onclick="delClient('${c.id}')">Smazat</button>
                </td>
            </tr>
        `).join('');
    } catch (e) {
        showMsg(e.message, true);
    }
}

function showAddForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = 'Novy klient';
    document.getElementById('fClientId').value = '';
    document.getElementById('fClientId').disabled = false;
    document.getElementById('fName').value = '';
    document.getElementById('fPassword').value = '';
    document.getElementById('fAccounts').value = '[\n  {"name": "Bezny ucet", "fioToken": ""}\n]';
    document.getElementById('formCard').classList.remove('hidden');
}

async function editClient(id) {
    try {
        const data = await api('clients', 'GET');
        const client = data.clients.find(c => c.id === id);
        if (!client) return;

        editingId = id;
        document.getElementById('formTitle').textContent = 'Upravit: ' + client.name;
        document.getElementById('fClientId').value = id;
        document.getElementById('fClientId').disabled = true;
        document.getElementById('fName').value = client.name;
        document.getElementById('fPassword').value = '';
        document.getElementById('fPassword').placeholder = '(ponechte prazdne pro zachovani)';
        document.getElementById('fAccounts').value = '';
        document.getElementById('formCard').classList.remove('hidden');
    } catch (e) {
        showMsg(e.message, true);
    }
}

function hideForm() {
    document.getElementById('formCard').classList.add('hidden');
    editingId = null;
}

async function saveClient() {
    const id = document.getElementById('fClientId').value.trim();
    const name = document.getElementById('fName').value.trim();
    const password = document.getElementById('fPassword').value;
    const accountsStr = document.getElementById('fAccounts').value.trim();

    let accounts;
    if (accountsStr) {
        try { accounts = JSON.parse(accountsStr); } catch { showMsg('Neplatny JSON v uctech', true); return; }
    }

    try {
        if (editingId) {
            const body = { id: editingId };
            if (name) body.name = name;
            if (password) body.password = password;
            if (accounts) body.accounts = accounts;
            await api('clients', 'PUT', body);
            showMsg('Klient aktualizovan');
        } else {
            if (!id || !name || !password) { showMsg('Vyplnte ID, nazev a heslo', true); return; }
            await api('clients', 'POST', { id, name, password, accounts: accounts || [] });
            showMsg('Klient vytvoren');
        }
        hideForm();
        loadClients();
    } catch (e) {
        showMsg(e.message, true);
    }
}

async function delClient(id) {
    if (!confirm('Opravdu smazat klienta ' + id + '?')) return;
    try {
        await api('clients?id=' + id, 'DELETE');
        showMsg('Klient smazan');
        loadClients();
    } catch (e) {
        showMsg(e.message, true);
    }
}

function showMsg(text, isErr) {
    const el = document.getElementById('dashMsg');
    el.textContent = text;
    el.className = 'msg ' + (isErr ? 'msg-err' : 'msg-ok');
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
}

document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
</script>
</body>
</html>
